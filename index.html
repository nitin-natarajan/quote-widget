<html>
<head>
    <title>Quote Widget</title>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
          background-color: #191919;
          padding: 5px;
          height: 100vh;
      }

      #wrap {
          border: 1px solid #121212;
          padding: 8px 10px;
          line-height: 1.5;
          height: 85%;
      }

      #quote {
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
          font-size: 18px;  
          color: #ff5757;
          font-style: italic;
          font-weight: bold;
      }

      #attribution {
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
          font-size: 12px;  
          color: #ff5757;
          font-weight: bold;
          opacity: 0.85;
          margin-top: 4px;
      }
    </style>
</head>

<body>
    <div id="wrap">
        <div id="quote">"time is what we want most, but what we use worst."</div>
        <div id="attribution">— william penn</div>
    </div>
</body>
</html>
